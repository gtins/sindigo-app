name: Sindigo Backend CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-sonar:
    name: Test, coverage and SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give permission to Maven wrapper
        run: chmod +x ./mvnw

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run tests and generate JaCoCo coverage
        run: |
          ./mvnw -B clean verify

      - name: Check JaCoCo XML report
        run: |
          echo "Checking JaCoCo XML report..."
          ls -la target/site/jacoco
          test -f target/site/jacoco/jacoco.xml
          echo "JaCoCo XML report found."

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.verbose=true \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Print SonarCloud task report
        if: always()
        run: |
          echo "===== SonarCloud report-task.txt ====="
          if [ -f target/sonar/report-task.txt ]; then
            cat target/sonar/report-task.txt
          else
            echo "target/sonar/report-task.txt not found"
          fi

      - name: Print Sonar target directory
        if: always()
        run: |
          echo "===== target/sonar directory ====="
          ls -la target/sonar || true

  build-and-push:
    name: Build and push Docker image
    needs: test-and-sonar
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give permission to Maven wrapper
        run: chmod +x ./mvnw

      - name: Build project
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sindigo-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/sindigo-backend:${{ github.sha }}

  deploy:
    name: Deploy backend on EC2
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - sindigo-ec2

    steps:
      - name: Update backend container
        run: |
          cd ~/sindigo-full-deploy
          docker compose pull backend
          docker compose up -d backend
          docker image prune -f
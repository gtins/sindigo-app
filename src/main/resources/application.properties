spring.application.name=sindigo

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sindigo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# IMPORTANTE:
# Localmente pode usar update.
# Em producao, o ideal depois e usar validate + migrations.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# ===============================
# CONNECTION / PERFORMANCE
# ===============================
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

# ===============================
# JWT CONFIGURATION
# ===============================
app.jwt.secret=${APP_JWT_SECRET:your-super-secret-key-that-should-be-at-least-32-characters-long-for-hs512}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

# ===============================
# ADMIN CONFIGURATION
# ===============================
app.admin.secret-key=${APP_ADMIN_SECRET_KEY:sindigo-hash-teste-sei-la}

# ===============================
# AOP / ASPECTJ CONFIGURATION
# ===============================
spring.aop.auto=true
spring.aop.proxy-target-class=true

# ===============================
# AWS S3 CONFIGURATION
# ===============================
aws.s3.region=${AWS_S3_REGION:}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.credentials.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ===============================
# MULTIPART FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}
